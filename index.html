      <div style="max-width:800px;margin:0 auto;padding:40px 20px;font-family:Inter,system-ui,sans-serif;color:#0F172A;line-height:1.7;background:#F8FAFC;min-height:100vh">
        <h1 style="font-size:2.5rem;font-weight:900;margin-bottom:0.5rem">Pre-Appointment 1</h1>
        <p style="font-size:1.1rem;color:#64748B;margin-bottom:2rem">Walk into your appointment with a file ready — not with half-remembered details.</p>

        <p>P1 captures what happens between doctor visits — pain, photos, temperature, notes — and compiles it into a clear, one-page physician briefing. So you spend those precious minutes on decisions, not reconstruction.</p>

        <h2 style="font-size:1.5rem;font-weight:700;margin-top:2.5rem">Features</h2>
        <ul>
          <li><strong>3D body map</strong> — tap a mannequin to mark exactly where it hurts, 23 body regions, front/back views</li>
          <li><strong>2-minute daily check-ins</strong> — pain gauge (0-10), temperature, photos with ghost overlay</li>
          <li><strong>AI analysis</strong> — Gemini-powered micro-reports and trend detection across time</li>
          <li><strong>Physician briefing</strong> — one-page PDF with charts, photos, and discussion questions</li>
          <li><strong>Privacy-first</strong> — self-deployable backend, full data deletion on request</li>
          <li><strong>Offline-ready</strong> — works without network, syncs when connected</li>
        </ul>
